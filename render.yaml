services:
  - type: web
    name: catproxyservice
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn --config gunicorn.conf.py wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ADMIN_SNAPSHOT_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
